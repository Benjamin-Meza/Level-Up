<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-primary">
        <div class="container">
            <a class="navbar-brand logo-font text-primary" href="index.html">LEVEL-UP GAMER</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Ingresar</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card bg-black border-primary">
                    <div class="card-body p-4">
                        <h2 class="text-center logo-font text-primary mb-4">Iniciar Sesión</h2>
                        <form id="formLogin">
                            <div class="mb-3">
                                <label for="correo" class="form-label text-light-gray">Correo Electrónico</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" id="correo" placeholder="ejemplo@duoc.cl">
                                <small id="errorCorreo" class="text-danger"></small>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label text-light-gray">Contraseña</label>
                                <input type="password" class="form-control bg-dark text-white border-secondary" id="password" placeholder="4 a 10 caracteres">
                                <small id="errorPassword" class="text-danger"></small>
                            </div>
                            <button type="submit" class="btn btn-success w-100 mb-3">Ingresar</button>
                            <div id="mensajeGeneral" class="text-center fw-bold mt-2"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black py-4 border-top border-primary text-center mt-auto fixed-bottom">
        <div class="container">
            <p class="text-light-gray mb-0">&copy; 2026 Level-Up Gamer.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
