<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-white gamer-bg d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-primary sticky-top shadow-lg">
        <div class="container">
            <a class="navbar-brand logo-font text-primary glow-text" href="index.html">LEVEL-UP GAMER</a>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card bg-black border-primary shadow-lg glassmorphism w-100" style="max-width: 450px;">
            <div class="card-body p-5">
                <h2 class="text-center logo-font text-primary mb-4">INICIAR SESIÓN</h2>
                <form id="formLogin">
                    <div class="mb-3">
                        <label for="correo" class="form-label text-light-gray small fw-bold">CORREO ELECTRÓNICO</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary neon-input" id="correo" placeholder="ej: usuario@duoc.cl">
                        <small id="errorCorreo" class="text-danger"></small>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-light-gray small fw-bold">CONTRASEÑA</label>
                        <input type="password" class="form-control bg-dark text-white border-secondary neon-input" id="password" placeholder="••••••••">
                        <small id="errorPassword" class="text-danger"></small>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-3 glow-btn fw-bold">INGRESAR</button>
                    <div id="mensajeGeneral" class="text-center fw-bold mt-2"></div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-black py-4 border-top border-primary text-center">
        <div class="container"><p class="text-light-gray mb-0">&copy; 2026 Level-Up Gamer.</p></div>
    </footer>

    <script src="js/funciones.js"></script>
</body>
</html>
