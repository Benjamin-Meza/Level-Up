<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-white gamer-bg">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-primary sticky-top shadow-lg">
        <div class="container">
            <a class="navbar-brand logo-font text-primary glow-text" href="index.html">
                <i class="bi bi-controller"></i> LEVEL-UP GAMER
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="navMenu">
                    <!-- El menú se llena con JS dependiendo si hay sesión -->
                </ul>
                <button class="btn btn-outline-success ms-3 position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
                    🛒 Carrito
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section con fondo estático decorativo -->
    <main class="hero-section d-flex align-items-center text-center text-md-start">
        <div class="container py-5">
            <div class="row align-items-center">
                <div class="col-md-7 mb-4 mb-md-0 hero-content p-5 rounded-4 border border-primary glassmorphism">
                    <h1 class="logo-font text-primary mb-3 display-4 fw-bold">¡Desafía tus límites!</h1>
                    <p class="lead text-light">Conviértete en el héroe de tu propia historia y únete a nuestra comunidad de jugadores. Equipamiento premium para setups de alto rendimiento.</p>
                    <a href="productos.html" class="btn btn-success btn-lg mt-3 glow-btn">Explorar Catálogo</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black py-4 border-top border-primary text-center mt-5">
        <div class="container">
            <p class="text-light-gray mb-0">&copy; 2026 Level-Up Gamer. Proyecto Universitario.</p>
        </div>
    </footer>

    <!-- Offcanvas del Carrito -->
    <div class="offcanvas offcanvas-end bg-dark text-white border-start border-primary" tabindex="-1" id="carritoOffcanvas">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title logo-font text-primary">Tu Carrito</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column" id="carrito-body">
            <!-- Items del carrito JS -->
        </div>
        <div class="offcanvas-footer p-3 border-top border-secondary bg-black">
            <div class="d-flex justify-content-between mb-3 fs-5 fw-bold">
                <span>Total:</span>
                <span class="text-success" id="carrito-total">$0</span>
            </div>
            <button class="btn btn-primary w-100 glow-btn" id="btn-pagar">Proceder al Pago</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
